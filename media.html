<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Media - Jan Olucha Fuentes</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <style>
    body {
      background-color: #f4f4f9;
      color: #333;
      line-height: 1.6;
      font-family: 'Arial', sans-serif;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #34495e;
      margin-bottom: 20px;
    }

    nav {
      background: #3498db;
      color: white;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }

    .gallery img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .gallery img:hover {
      transform: scale(1.05);
      transition: 0.3s ease-in-out;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9em;
      color: #7f8c8d;
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="media.html">Media</a>
  </nav>

  <!-- Main Content -->
  <main>
    <h1>Media</h1>
    <p>Here are some interesting pictures that I’d like to share!</p>
    <div class="gallery">
      <img src="media/image1.jpg" alt="Description 1">
      <img src="media/image2.jpg" alt="Description 2">
      <img src="media/image3.jpg" alt="Description 3">
      <img src="media/image4.jpg" alt="Description 4">
      <img src="media/image5.jpg" alt="Description 5">
    </div>
  </main>

  <footer>
    <p>&copy; 2024 Jan Olucha Fuentes</p>
  </footer>
</body>
</html>
